scripts:
  # ====== 200 组 (默认) ======
  200:
    tasks:
      - name: 送人气
      - name: 公会签到
      - name: 领取个人奖励
      - name: 神秘河日常
      - name: 神秘河副本
        condition: weekday==((index/100-1)%5)+1
      - name: 怪物乐园跳关
        options:
          标签位置: 倒数3号
          关卡: 隐匿痕迹
      - name: 宝石副本
        options:
          难度: 超难
      - name: 武陵道场
        condition: weekday>=1 && weekday<=4
      - name: 精英副本
        options:
          副本名: 驮狼雪人
      - name: 奈特的金字塔
      - name: 购买委托书
        condition: weekday==1
        options:
          商品列表: 1号商品,2号商品
      - name: 委托佣兵
        condition: weekday>=1 && weekday<=6
        options:
          最大切换: 2
          最大接受: 3
      - name: 材料副本
        options:
          副本名: 玩具城
      - name: 每日领主
        options:
          副本名: 班雷昂
      - name: 分解装备
        condition: weekday==2 || weekday==5
      # - name: 分享图片
        # condition: weekday==0
      # - name: 梦之操纵者
        # condition: weekday==0
      - name: 领取日常奖励
      - name: 领取公会奖励

