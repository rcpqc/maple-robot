scripts:
  # ====== 150 组 ======
  150:
    tasks:
      - name: 送人气
      - name: 公会签到
      - name: 领取个人奖励
      - name: 怪物乐园跳关
        options:
          标签位置: 倒数1号
          关卡: 隐匿痕迹
      - name: 天空岛贸易
      - name: 周常副本
        options:
          难度: 超难
      - name: 武陵道场
        condition: weekday>=1 && weekday<=4
      - name: 精英副本
      - name: 奈特的金字塔
      - name: 购买委托书
        condition: weekday==1
        options:
          商品列表: 1号商品,2号商品
      - name: 委托佣兵
        condition: weekday==1 && weekday<=6
        options:
          最大切换: 2
          最大接受: 3
      - name: 金钩海兵王
      - name: 材料副本
        options:
          副本名: 龙之峡谷
      - name: 领取日常奖励
      - name: 领取公会奖励

